services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medqa_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: medqa_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false        # dev only — không auth cho gọn
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"        # giới hạn heap, đủ cho 40K doc
    ports:
      - "9200:9200"
    volumes:
      - ./es_storage:/usr/share/elasticsearch/data
    restart: unless-stopped

  # ── MLflow tracking (bản mới nhất) — theo dõi run eval multi-agent ──────────
  # Backend sqlite + artifact store để trong volume ./mlflow_data.
  # Client (venv) log qua http://localhost:5000; artifact đi qua proxy của server
  # (mlflow-artifacts:) nên host không cần thấy đường dẫn /mlflow trong container.
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: medqa_mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    # MLflow 3.x (FastAPI) mặc định chỉ cho phép Host/Origin là localhost nên khi
    # mở UI qua IP máy chủ (http://10.10.50.99:5000) mọi request ajax bị chặn 403.
    # Đặt "*" để chấp nhận mọi host/origin (server nội bộ, không expose public).
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/mlflow
    restart: unless-stopped
